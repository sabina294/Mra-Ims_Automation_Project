<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1" name="viewport"/>
        <title>
            IMS2 Test Result Summary
        </title>
        <style>
            body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #eef2f7;
            margin: 20px;
            color: #2c3e50;
            }
            h1 {
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
            color: #34495e;
            }
            .table-container {
            max-width: 100%;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 6px 12px rgb(0 0 0 / 0.1);
            padding: 16px;
            }
            table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
            }
            th, td {
            padding: 12px 16px;
            text-align: center;
            }
            thead {
            background-color: #2980b9;
            color: #ecf0f1;
            }
            tbody tr:nth-child(even) {
            background-color: #f9fbfc;
            }
            tbody tr:hover {
            background-color: #d6eaff;
            }
            td.pass {
            color: #27ae60;
            font-weight: 600;
            }
            td.fail {
            color: #c0392b;
            font-weight: 700;
            }
            td.duration {
            font-style: italic;
            color: #7f8c8d;
            }
            a.report-link {
            color: #2980b9;
            font-weight: 600;
            text-decoration: none;
            }
            a.report-link:hover {
            text-decoration: underline;
            }
            @media (max-width: 768px) {
            body {
            margin: 10px;
            }
            h1 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            }
            table {
            font-size: 14px;
            min-width: 550px;
            }
            th, td {
            padding: 10px 12px;
            }
            }
            @media (max-width: 480px) {
            table {
            min-width: 450px;
            font-size: 12px;
            }
            th, td {
            padding: 8px 10px;
            }
            }
            /* Footer style */
            .footer-update {
            margin-top: 24px;
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1>
            Cypress Test Result Summary Report
        </h1>
        <div class="table-container">
            <table aria-label="Cypress test result summary" id="result-summary">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Date</th>
                        <th scope="col">Total Suites</th>
                        <th scope="col">Total Tests</th>
                        <th scope="col">Passed</th>
                        <th scope="col">Failed</th>
                        <th scope="col">Pending</th>
                        <th scope="col">Skipped</th>
                        <th scope="col">Duration</th>
                        <th scope="col">Start</th>
                        <th scope="col">End</th>
                        <th scope="col">Report Link</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Summary rows inserted here -->
                </tbody>
            </table>
        </div>
        <footer class="footer-update">
            Last updated on 2025-05-25 18:39:16
        </footer>
    </body>
</html>
