<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>IMS2 Test Result Summary</title>
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f7;
      margin: 40px 80px;
      color: #2c3e50;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #34495e;
      font-size: 40px;
    }
    .website-link {
      text-align: center;
      margin-top: -10px;
      font-size: 16px;
    }
    .website-link a {
      color: #2980b9;
      text-decoration: none;
    }
    .website-link a:hover {
      text-decoration: underline;
    }
    .table-container {
      max-width: 100%;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
      padding: 24px 32px;
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 800px;
    }
    thead {
      background-color: #2980b9;
      color: #ecf0f1;
    }
    th, td {
      padding: 12px 16px;
      text-align: center;
      white-space: nowrap;
      font-size: 16px;
    }
    tbody tr:nth-child(even) {
      background-color: #f9fbfc;
    }
    tbody tr:hover {
      background-color: #d6eaff;
    }
    td.pass {
      color: #27ae60;
      font-weight: bold;
    }
    td.fail {
      color: #c0392b;
      font-weight: bold;
    }
    td.duration {
      font-style: italic;
      color: #7f8c8d;
    }
    a.report-link {
      color: #2980b9;
      font-weight: bold;
      text-decoration: none;
    }
    a.report-link:hover {
      text-decoration: underline;
    }
    .footer-update {
      margin-top: 24px;
      font-size: 14px;
      color: #666666;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Cypress Test Result Summary Report</h1>
  <p class="website-link">
    <a href="https://ims2-cypress.com" target="_blank">ims2-cypress.com</a>
  </p>
  <div class="table-container" role="region" aria-label="Test result summary table container">
    <table aria-label="Cypress test result summary" id="result-summary">
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Total Suites</th>
          <th>Total Tests</th>
          <th>Passed</th>
          <th>Failed</th>
          <th>Pending</th>
          <th>Skipped</th>
          <th>Duration</th>
          <th>Start</th>
          <th>End</th>
          <th>Report Link</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data rows will be inserted here -->
      </tbody>
    </table>
  </div>
  <footer class="footer-update" role="contentinfo">
    Last updated on 2025-05-25 18:39:16
  </footer>
</body>
</html>
