<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>IMS2 Test Result Summary</title>
  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #eef2f7;
      margin: 40px 80px;
      color: #2c3e50;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 700;
      color: #34495e;
      font-size: 2.5rem;
    }
    p.website-link {
      text-align: center;
      margin-top: -10px;
      font-size: 1rem;
    }
    p.website-link a {
      color: #2980b9;
      text-decoration: none;
      font-weight: 600;
    }
    p.website-link a:hover {
      text-decoration: underline;
    }

    .table-container {
      max-width: 100%;
      background: white;
      border-radius: 8px;
      box-shadow: 0 6px 12px rgb(0 0 0 / 0.1);
      padding: 24px 32px;
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 800px;
    }

    thead {
      display: table-header-group;
      background-color: #2980b9;
      color: #ecf0f1;
    }

    thead tr {
      border-radius: 8px 8px 0 0;
    }

    th, td {
      padding: 12px 16px;
      text-align: center;
      white-space: nowrap;
      font-size: 1rem;
    }

    tbody tr:nth-child(even) {
      background-color: #f9fbfc;
    }

    tbody tr:hover {
      background-color: #d6eaff;
    }

    td.pass {
      color: #27ae60;
      font-weight: 600;
    }

    td.fail {
      color: #c0392b;
      font-weight: 700;
    }

    td.duration {
      font-style: italic;
      color: #7f8c8d;
    }

    a.report-link {
      color: #2980b9;
      font-weight: 600;
      text-decoration: none;
    }

    a.report-link:hover {
      text-decoration: underline;
    }

    .footer-update {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #666;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Cypress Test Result Summary Report</h1>
  <p class="website-link">
    <a href="https://cypress.mra.gov.bd" target="_blank">cypress.mra.gov.bd</a>
  </p>
  <div class="table-container" role="region" aria-label="Test result summary table container">
    <table aria-label="Cypress test result summary" id="result-summary">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Date</th>
          <th scope="col">Total Suites</th>
          <th scope="col">Total Tests</th>
          <th scope="col">Passed</th>
          <th scope="col">Failed</th>
          <th scope="col">Pending</th>
          <th scope="col">Skipped</th>
          <th scope="col">Duration</th>
          <th scope="col">Start</th>
          <th scope="col">End</th>
          <th scope="col">Report Link</th>
        </tr>
      </thead>
      <tbody>
        <!-- Add rows dynamically -->
      </tbody>
    </table>
  </div>
  <footer class="footer-update" role="contentinfo">
    Last updated on 2025-05-25 18:39:16
  </footer>
</body>
</html>
