<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>IMS2 Test Result Summary</title>
  <style>
    /* Base styles */
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #eef2f7;
      margin: 12px;
      color: #2c3e50;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
      color: #34495e;
      font-size: 1.8rem;
    }

    /* Table container */
    .table-container {
      max-width: 100%;
      background: white;
      border-radius: 8px;
      box-shadow: 0 6px 12px rgb(0 0 0 / 0.1);
      padding: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* MOBILE CARD VIEW (default) */
    table {
      border-collapse: separate;
      border-spacing: 0 1rem;
      width: 100%;
    }
    thead {
      display: none; /* hide header on mobile */
    }
    tbody tr {
      display: block;
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      box-shadow: 0 3px 8px rgb(0 0 0 / 0.1);
      margin-bottom: 1rem;
      transition: background-color 0.3s ease;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tbody td {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
      white-space: normal;
      text-align: left;
      font-weight: 500;
    }

    /* Fix for Report Link bottom border: don't remove it */
    tbody td:last-child:not(.report-link) {
      border-bottom: none;
    }
    tbody td.report-link {
      border-bottom: 1px solid #eee;
    }

    td.pass {
      color: #27ae60;
      font-weight: 700;
    }
    td.fail {
      color: #c0392b;
      font-weight: 700;
    }
    td.duration {
      font-style: italic;
      color: #7f8c8d;
    }
    a.report-link {
      color: #2980b9;
      font-weight: 700;
      text-decoration: none;
      word-break: break-word;
    }
    a.report-link:hover {
      text-decoration: underline;
    }

    /* FOOTER */
    .footer-update {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #666;
      text-align: center;
      font-style: italic;
    }

    /* LABELS BEFORE DATA (Mobile) */
    tbody td::before {
      content: attr(data-label);
      font-weight: 700;
      color: #2980b9;
      flex-basis: 45%;
      flex-shrink: 0;
    }

    /* TABLET AND DESKTOP: revert to table layout with original styling */
    @media (min-width: 600px) {
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 800px;
        border-spacing: 0;
      }
      thead {
        display: table-header-group;
        background-color: #2980b9;
        color: #ecf0f1;
      }
      thead tr {
        border-radius: 8px 8px 0 0;
      }
      th, td {
        padding: 12px 16px;
        text-align: center;
        white-space: nowrap;
        /* border-bottom removed here as per your request */
        font-size: 1rem;
      }
      tbody tr {
        display: table-row;
        background: transparent;
        box-shadow: none;
        margin-bottom: 0;
        padding: 0;
        transition: background-color 0.2s ease;
      }
      tbody tr:nth-child(even) {
        background-color: #f9fbfc;
      }
      tbody tr:hover {
        background-color: #d6eaff;
      }
      tbody td {
        display: table-cell;
        /* border-bottom removed */
        padding: 12px 16px;
        text-align: center;
        white-space: nowrap;
        font-weight: normal;
      }
      tbody td::before {
        content: none;
      }
      td.pass {
        color: #27ae60;
        font-weight: 600;
      }
      td.fail {
        color: #c0392b;
        font-weight: 700;
      }
      td.duration {
        font-style: italic;
        color: #7f8c8d;
      }
      a.report-link {
        color: #2980b9;
        font-weight: 600;
        text-decoration: none;
        word-break: normal;
      }
      a.report-link:hover {
        text-decoration: underline;
      }
      .table-container {
        padding: 24px 32px;
      }
      body {
        margin: 40px 80px;
      }
      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <h1>Cypress Test Result Summary Report</h1>
  <p style="text-align: center; margin-top: -10px; font-size: 1rem;">
  <a href="https://cypress.mra.gov.bd" target="_blank" style="color: #2980b9; text-decoration: none;">
    cypress.mra.gov.bd
  </a>
</p>
  <div class="table-container" role="region" aria-label="Test result summary table container">
    <table aria-label="Cypress test result summary" id="result-summary">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Date</th>
          <th scope="col">Total Suites</th>
          <th scope="col">Total Tests</th>
          <th scope="col">Passed</th>
          <th scope="col">Failed</th>
          <th scope="col">Pending</th>
          <th scope="col">Skipped</th>
          <th scope="col">Duration</th>
          <th scope="col">Start</th>
          <th scope="col">End</th>
          <th scope="col">Report Link</th>
        </tr>
      </thead>
      <tbody>
        <!-- Add more rows with data-label attributes -->
      </tbody>
    </table>
  </div>
  <footer class="footer-update" role="contentinfo">
    Last updated on 2025-05-25 18:39:16
  </footer>
</body>
</html>
